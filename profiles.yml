dbt_core_databricks_demo:
  outputs:
    dev:
      catalog: yuli_demo_dbt
      host: dbc-xxxxxxxxx.cloud.databricks.com
      http_path: /sql/1.0/warehouses/xxxxxxxxx
      schema: default
      threads: 1
      token: "{{env_var('DATABRICKS_TOKEN')}"
      type: databricks
    prod:
      catalog: yuli_demo_dbt_prod
      host: dbc-xxxxxxxxx.cloud.databricks.com
      http_path: /sql/1.0/warehouses/xxxxxxxxx
      schema: default
      threads: 1
      token: "{{env_var('DATABRICKS_TOKEN')}"
      type: databricks
  target: dev
