sources: #https://docs.getdbt.com/reference/dbt-jinja-functions/source?version=2
  - name: landing 
    database: "{{target.catalog}}"
    schema: landing
    tables:
      - name: orders 
        columns:
          - name: id
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn               
          - name: quantity
            data_tests:
              - dbt_utils.expression_is_true:
                  arguments:
                    expression: ">=0"
          - name: unit_price
            data_tests:
              - dbt_utils.expression_is_true:
                  arguments:
                    expression: ">=0"
      - name: products
      - name: reviews
      - name: users

        # data freshness check:
